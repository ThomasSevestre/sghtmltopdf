name: gem (x86_64-darwin test)

# 一時的な検証用。x86_64-darwin の cross build と smoke だけを回す。
# PRを出す前にこのファイルは消すこと。

on:
  push:
  workflow_dispatch:

jobs:
  cross-gem:
    name: build x86_64-darwin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - uses: oxidize-rb/actions/cross-gem@v1
        id: cross-gem
        with:
          platform: x86_64-darwin
          working-directory: bindings/ruby
          ruby-versions: "3.2,3.3,3.4,4.0"
      - name: 同梱されたRuby ABIを表示する
        run: |
          gem=$(find bindings/ruby/pkg -name '*-x86_64-darwin.gem')
          echo "### $(basename "$gem")" >> "$GITHUB_STEP_SUMMARY"
          ruby -rrubygems/package -e '
            spec = Gem::Package.new(ARGV[0]).spec
            abis = spec.files.grep(%r{\Alib/sghtmltopdf/(\d+\.\d+)/}) { $1 }.uniq.sort
            puts "- platform: #{spec.platform}"
            puts "- ruby ABI: #{abis.empty? ? "(なし)" : abis.join(", ")}"
            puts "- required_ruby_version: #{spec.required_ruby_version}"
          ' "$gem" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: gem-x86_64-darwin
          path: bindings/ruby/pkg/*-x86_64-darwin.gem
          if-no-files-found: error

  smoke-macos-x86_64:
    needs: cross-gem
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gem-x86_64-darwin
          path: pkg
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: gem install して変換する
        run: |
          gem install --no-document ./pkg/*.gem
          ruby bindings/ruby/script/smoke.rb
